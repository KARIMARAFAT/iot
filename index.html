<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنك أسئلة CS412 — إنترنت الأشياء (كويز لكل أسبوع)</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e1b4b; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --txt:#f1f5f9; --mut:#94a3b8; --acc:#818cf8; --acc2:#38bdf8;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Tahoma,"Segoe UI",Arial,sans-serif; color:var(--txt);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh; overflow-x:hidden; display:flex; align-items:center; justify-content:center; padding:20px;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 16s ease-in-out infinite}
.b1{width:340px;height:340px;background:#6366f1;top:-80px;right:-60px}
.b2{width:280px;height:280px;background:#0ea5e9;bottom:-70px;left:-50px;animation-delay:-6s}
.b3{width:200px;height:200px;background:#a855f7;top:40%;left:40%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-25px) scale(1.08)}}

.app{position:relative;z-index:1;width:100%;max-width:680px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hide{display:none !important}

.head{text-align:center;padding:26px 24px 6px;animation:fadeDown .7s ease both}
.head h1{margin:0;font-size:22px;letter-spacing:.2px}
.head p{margin:6px 0 0;color:var(--mut);font-size:14px}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* start */
#start{padding:24px;text-align:center;animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.icon-big{font-size:56px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.sec-title{text-align:right;font-size:15px;font-weight:700;margin:22px 0 10px;color:#c7d2fe}
.wgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.wgrid{grid-template-columns:1fr 1fr}}
.wcard{
  text-align:right;padding:16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);cursor:pointer;font-family:inherit;transition:.25s;display:flex;flex-direction:column;gap:8px
}
.wcard:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 25px rgba(129,140,248,.25)}
.wcard:active{transform:scale(.98)}
.wcard .wt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard h3{margin:0;font-size:15px}
.wcard .cnt{font-size:12px;background:rgba(129,140,248,.2);color:#c7d2fe;padding:3px 10px;border-radius:999px;white-space:nowrap}
.wcard ul{margin:0;padding-inline-start:18px;color:var(--mut);font-size:13px;line-height:1.7}
.wcard .go{color:#7dd3fc;font-weight:700;font-size:13px}
.wcard.all{border-style:dashed}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{
  padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);cursor:pointer;font-size:14px;font-family:inherit;transition:.25s
}
.mode small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.mode:hover{border-color:var(--acc)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 10px 25px rgba(56,189,248,.3);
  transition:transform .2s, box-shadow .2s, opacity .2s;font-family:inherit
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(56,189,248,.4)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* quiz */
#quiz{padding:22px 24px 26px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:10px;gap:8px}
.pill{padding:4px 12px;border-radius:999px;background:rgba(129,140,248,.18);color:#c7d2fe;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scorebox{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:14px}
.scorebox b{color:var(--txt)}
.qcard{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.qcard.out{animation:slideOut .3s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.qcard.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:rgba(56,189,248,.15);color:#7dd3fc;margin-left:6px}
.qtext{font-size:17px;line-height:1.75;margin:12px 0 18px;direction:ltr;text-align:left}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;direction:ltr;
  padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);font-size:15px;cursor:pointer;transition:.2s;animation:popIn .4s ease both;font-family:inherit
}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(-4px);background:rgba(129,140,248,.1)}
.opt .k{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:700;font-size:13px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.16);animation:pulseOk .6s}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.16)}
.opt.right .k{background:var(--ok)} .opt.wrong .k{background:var(--bad)}
@keyframes pulseOk{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

.feed{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.7;animation:fadeUp .4s ease both}
.feed.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4)}
.feed.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
.feed h3{margin:0 0 6px;font-size:15px}
.feed p{margin:0;color:#e2e8f0;direction:ltr;text-align:left}
.next-row{display:flex;justify-content:flex-start;margin-top:16px}

/* results */
#results{padding:30px 24px;text-align:center;animation:fadeUp .7s ease both}
.ring{position:relative;width:180px;height:180px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
.ring .num small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.msg{font-size:18px;margin:6px 0 4px;animation:fadeUp .8s .2s both}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.stat{padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);animation:popIn .5s both}
.stat:nth-child(2){animation-delay:.12s}
.stat b{display:block;font-size:22px;margin-top:4px}
.actions{display:grid;gap:10px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

.footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.4);z-index:1}
kbd{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.sumtitle{font-size:18px;margin:14px 0 10px;text-align:right}
.sumbox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:8px}
.sumhead{font-weight:700;color:#c7d2fe;margin-bottom:8px}
.sumlist{margin:0;padding-inline-start:20px;color:#e2e8f0;font-size:14px;line-height:1.9}
.sumlist li{margin-bottom:6px}
.toggle{display:flex;gap:8px;align-items:center;justify-content:flex-end;color:var(--mut);font-size:14px;margin:6px 0}
#summary,#home{text-align:right}
#summary .topbar{display:flex;justify-content:space-between;align-items:center}
#summary .next-row{justify-content:center;margin-top:14px}
#summary .btn{width:100%}
.wrap-app{position:relative;z-index:0}
.wcard .go{color:#7dd3fc}

</style>
</head>
<body>
<div class="wrap-app">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="app">
  <div class="glass">
    <div class="head">
      <h1>بنك أسئلة CS412 · إنترنت الأشياء</h1>
      <p>كويز لكل أسبوع + البنك المحلول (80 سؤال)</p>
    </div>

    <!-- HOME: week sections -->
    <div id="home">
      <div class="icon-big">🧠</div>
      <div class="sec-title">اختار الأسبوع</div>
      <div class="wgrid" id="weekGrid"></div>
    </div>

    <!-- SUMMARY before each quiz -->
    <div id="summary" class="hide">
      <div class="topbar"><button class="btn ghost" onclick="home()">⟵ الأسابيع</button><span class="pill" id="sumCount"></span></div>
      <h2 class="sumtitle" id="sumTitle"></h2>
      <div class="sumbox"><div class="sumhead">ملخص الأسبوع</div><ul class="sumlist" id="sumList"></ul></div>
      <label class="toggle"><input type="checkbox" id="shuffle"> خلط الأسئلة</label>
      <div class="next-row"><button class="btn" id="startBtn">ابدأ الكويز ←</button></div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="hide">
      <div class="topbar"><span id="counter"></span><span class="pill" id="type"></span></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="scorebox"><span>صح حتى الآن: <b id="liveScore">0</b></span><span>غلط: <b id="liveWrong">0</b></span></div>
      <div id="qcard" class="qcard">
        <span class="tag" id="wk"></span>
        <div class="qtext" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div id="feed" class="feed hide"></div>
        <div class="next-row"><button class="btn hide" id="nextBtn" onclick="next()">السؤال الجاي ←</button></div>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="results" class="hide">
      <div class="ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
          <circle class="bg" cx="90" cy="90" r="78" fill="none" stroke-width="14"/>
          <circle class="fg" id="ringFg" cx="90" cy="90" r="78" fill="none" stroke-width="14" stroke-dasharray="490" stroke-dashoffset="490"/>
        </svg>
        <div class="num"><div><span id="pctNum">0%</span><small id="pctSub"></small></div></div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="sub" id="sub"></div>
      <div class="stats">
        <div class="stat">من أول محاولة<b id="firstScore">0</b></div>
        <div class="stat">بعد المراجعة<b id="finalScore">0</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="retryBtn" onclick="retry()">راجع الأسئلة اللي غلطت فيها</button>
        <button class="btn ghost" onclick="home()">رجوع للأسابيع</button>
      </div>
    </div>
  </div>
</div>
</div>
<div class="footer">اختصارات: <kbd>1</kbd>–<kbd>4</kbd> للاختيار · <kbd>Enter</kbd> للسؤال الجاي</div>

<script>
const WEEKS = {
  1: { title: "الأسبوع 1 — من M2M لـ IoT", summary: [
    "M2M: اتصال بين أجهزة من نفس النوع وتطبيق معين، بتدخل بشري قليل. IoT: تشبيك أشياء فريدة بالإنترنت، والمعلومات اللي بتطلعها بتتجمع وتتحلل وتستخدمها تطبيقات كتير.",
    "الفرق الأساسي: M2M عن الاتصال (توصيل القراءة للتطبيق)، و IoT عن المعلومات (إيه اللي ممكن يتعمل بيها ومين يستفيد).",
    "M2M الكلاسيكي = Vertical Silos: كل تطبيق ليه أجهزته وشبكته ومنصته، ومفيش حاجة بتتشارك، فكل تطبيق جديد بيتبني من الصفر وبتكلفة كبيرة.",
    "التحول لـ IoT: مفتوح، أفقي، ومعلومات-مركزي. الأجهزة بتتكلم IP، والمنصات مشتركة كطبقة أفقية، والداتا بتتعاد استخدامها (مثال: Smart Metering).",
    "دوافع التحول: تكنولوجية (MCU ورادي رخيص، IPv6، Cloud)، وبيزنس (بيع خدمة power by the hour)، ومجتمعية (تغير المناخ، التحضر، eCall).",
    "حسابات مهمة: الـ jitter بيوزع الرسائل، والـ headers بتاكل الكفاءة مع الـ payloads الصغيرة، والـ radio هو اللي بيستهلك البطارية مش النوم.",
    "MQTT Pub/Sub: Publisher ← Broker → Subscribers. الـ + بيمثل مستوى واحد، والـ # بيمثل كل اللي تحته."
  ]},
  2: { title: "الأسبوع 2 — اقتصاد IoT وسلسلة القيمة", summary: [
    "Value chain: كل الأنشطة من الفكرة لحد الاستخدام. ولو المراحل في دول مختلفة بتبقى Global Value Chain.",
    "أنواع الحوكمة (governance): Market, Modular, Relational, Captive, Hierarchy.",
    "Value chain خطية وبتتنسق بالسعر أو الـ lead firm، أما Business ecosystem فشبكة علاقات متعددة بتتنسق بمنصة وقواعد (APIs, app stores).",
    "M2M: سلسلة قصيرة ومقفولة، والإيرادات في Devices (35%) و Connectivity (30%). في IoT: Applications & Information بياخدوا حوالي 53%، والـ connectivity بيوصل 6%.",
    "المعلومات سلعة: non-rival، near-zero marginal cost، combinable، perishable. ولهذا تتباع أكتر من مرة.",
    "منحنى الابتسامة (Smile curve): الهوامش العالية في الأطراف (chips وsensors وInformation & Services)، والمنخفضة في النص (commodity hardware وconnectivity).",
    "I-GVC: Inputs ← Data factories ← Wholesalers ← Intermediaries ← Resellers. والصناعة بتتحول من vertical لـ horizontal.",
    "الاحتكار: network effects (Metcalfe: V ∝ n²) وdata feedback وeconomies of scale. HHI = Σs²، وأكتر من 1800 = تركيز عالي. التنظيم: EU Data Act وGDPR وOpen standards (MQTT, LWM2M)."
  ]},
  3: { title: "الأسبوع 3 — معمارية IoT", summary: [
    "IoT = “M2M made horizontal”: القدرات المشتركة بتطلع من الـ silos لطبقات أفقية مشتركة.",
    "ضغوط بتفرض معمارية واضحة: Scale (ملايين أجهزة)، Heterogeneity (أجهزة وشبكات مختلفة)، Longevity (الأجهزة بتعيش أكتر من التطبيقات).",
    "تعريفات: Architecture، Stakeholders & Concerns، Views (Functional، Information، Deployment)، وPerspectives زي الأمن اللي بيلمس كل الـ views.",
    "مستويات التجريد: Reference model (مفردات مشتركة) ← Reference architecture (blueprint) ← Concrete architecture (نظام محدد بمنتجات وبروتوكولات).",
    "المبادئ: Heterogeneity بالـ abstraction، Scalability بالـ asynchronous messaging، Energy بالـ duty cycling، Embedded security من الأول. ومبادئ الهندسة: Loose coupling، Layering، Function placement.",
    "طبقات المعمارية: Asset ← Resource ← Device ← Gateway ← Network ← Service ← Application. ETSI M2M قسم لـ Device & Gateway domain وNetwork domain، وSCL اتسمى في oneM2M الـ CSE.",
    "مقاييس كمية: الـ aggregation بيقلل message rate، والـ jitter للـ bursts، والـ latency بيتقفل عند الـ edge، والـ availability (series بيضرب، parallel بيحسّن، store-and-forward بيحمي البيانات).",
    "التوحيد: IEEE (802.15.4)، 3GPP (NB-IoT، LTE-M)، IETF (6LoWPAN، CoAP)، OASIS (MQTT)، ETSI/oneM2M، W3C/OGC."
  ]},
  4: { title: "الأسبوع 4 — الحساسات والعقد والأنظمة", summary: [
    "Signal chain: Transducer ⟶ Conditioning ⟶ ADC ⟶ MCU، وكل مرحلة بتضيف خطأ.",
    "Sensors: Self-generating (زي thermocouple وPV) مقابل Modulating (زي thermistor وstrain gauge). والـ Digital modules مفضلة في IoT.",
    "Digitising: LSB = Vref / 2^N. ونظرية Nyquist: fs > 2·fmax، وإلا بيحصل Aliasing.",
    "Accuracy (قربك من الحقيقة، بيتصلح بالـ calibration) مقابل Precision (التكرار، بيتحسن بالـ averaging). Drift بيتصلح بإعادة الـ calibration. وازاي تكاليب الـ chain كله مش الـ sensor بس.",
    "Actuators: latching solenoid valves للبطاريات، لأنها بتحتاج نبضة قصيرة (~20 ms) بدل تيار مستمر.",
    "العقدة الحساسة: Sensors/Actuators، MCU، Power unit، Radio (أكبر مستهلك). الاستقبال بيكلف زي الإرسال، فالـ sleep مهم جدًا.",
    "الطاقة: Duty cycle، Average current، وderating البطارية بـ 30%. وأرخص طاقة هي اللي مش بتبعتها: “report on change” + heartbeat.",
    "Energy harvesting: Energy-neutral (الحصاد ≥ الاستهلاك + تخزين كفاية). الشمس الخارجية أقوى حوالي 1000 مرة من الداخل. Supercapacitors عمرها أطول لكن بتخزن قليل.",
    "WSN topologies: Star (بسيطة)، Tree (روتر واقع = فرع كامل واقع)، Mesh (متينة لكن الراوتر لازم يسمع دايمًا)، Cluster-tree. وEnergy hole: النودات اللي قرب الـ sink بتموت الأول.",
    "RFID وNFC: Passive tags من غير بطارية وبتاخد طاقتها من الـ reader. LF/HF near-field، UHF far-field (96-bit EPC)، NFC على 13.56 MHz للـ commissioning بالنقرة."
  ]}
};

const RAW = [
[1,`According to the core definitions, what is the primary focus of an M2M solution?`,[`Creating new knowledge by combining distinct datasets`,`Communication between a device and its specific application`,`Sharing device data across multiple business processes`,`Utilizing cloud computing to optimize general internet traffic`],1,`M2M is strictly about communication between a device and its specific application.`],
[1,`Which of the following best describes the structural architecture of a traditional M2M solution?`,[`A horizontal shared platform`,`An open data ecosystem`,`A vertical silo`,`A cloud-native marketplace`],2,`Traditional M2M is a vertical silo where everything is proprietary and unshared.`],
[1,`In the context of IoT economics, why is adding a new application to an existing IoT system highly cost-effective?`,[`Because new applications do not require internet access`,`Because IoT relies on proprietary non-IP protocols`,`Because the cost of new sensors drops by 50% every year`,`Because the infrastructure is paid for once and shared (marginal-cost argument)`],3,`IoT uses a shared horizontal platform, so new apps reuse existing data and infrastructure.`],
[1,`How does data ownership typically differ between M2M and IoT?`,[`In M2M, data is shared openly; in IoT, it is highly restricted.`,`In M2M, data is owned by one application; in IoT, it is shared, combined, and enriched.`,`In M2M, data is owned by the network provider; in IoT, it is owned by the government.`,`There is no difference; both models strictly isolate data per application.`],1,`M2M locks data in one application's database; IoT treats data as a shareable, combinable asset.`],
[1,`Which of the following is considered a "Society" driver that pushed the evolution from M2M to IoT?`,[`The creation of cloud computing platforms`,`The drop in prices for Microcontroller Units (MCUs)`,`Urbanization leading to the need for smart city management`,`Companies shifting to selling services instead of products`],2,`Urbanization is a societal driver; the others are technology or business drivers.`],

[1,`Does an IoT architecture completely replace M2M communications?`,[`Yes, IoT removes the need for hardware sensors entirely.`,`Yes, M2M networks are completely dismantled when IoT is implemented.`,`No, IoT contains M2M by adding open interfaces and shared platforms around the communication link.`,`No, M2M and IoT are parallel networks that cannot interact.`],2,`IoT wraps around the existing M2M infrastructure rather than replacing it.`],

[2,`The shift from M2M to IoT mirrors the 1990s computer industry by moving from a vertical structure to a:`,[`Captive structure`,`Horizontal structure`,`Hierarchy structure`,`Circular structure`],1,`IoT moves to a horizontal structure where each layer is its own distinct industry.`],

[2,`A smartphone app gathers user locations, aggregates the data globally, and sells premium routing. This firm is acting as:`,[`Only a data factory`,`Only a reseller`,`A combination of data factory, wholesaler, and reseller`,`A traditional M2M captive supplier`],2,`It generates data (factory), aggregates it globally (wholesaler) and sells routing apps (reseller).`],

[3,`A reference architecture commits completely to specific products, protocols and deployment.`,1,`False. A reference architecture is a reusable blueprint; a concrete architecture commits to specific products and deployment.`],
[3,`In the ETSI M2M high-level architecture, the M2M applications sit in the network domain.`,0,`True. In ETSI M2M, the network domain hosts the applications, while device/gateway elements form the other domain.`],
[3,`In the smart-metering example, adding data concentrators cut both the number of messages and the number of bytes by the same factor of 200.`,1,`False. The concentrator reduces message count 200-fold, but bytes only 2.8-fold because headers are amortised.`],
[3,`The availability of the data can never be higher than the availability of the path it travels over.`,1,`False. Store-and-forward buffering can preserve data availability even when the communication path is temporarily unavailable.`],
[4,`A digital sensor module has its own ADC and delivers numbers over a bus such as I²C, SPI, UART or 1-Wire.`,0,`True. A digital sensor module can contain its own ADC and output digital values over buses such as I²C or SPI.`],
[4,`Using an ADC with more bits will remove a sensor’s bias.`,1,`False. More ADC bits improve resolution, but they do not remove sensor bias; calibration is needed.`],
[4,`In the notes’ example node with a 60 s period, the duty cycle is only about 0.42%, yet the active phases use about 92% of the charge.`,0,`True. The notes give a 0.42% duty cycle while active phases account for about 92% of charge.`],
[4,`In a multi-hop WSN, the nodes farthest from the sink die first because they send the most packets.`,1,`False. Nodes near the sink usually die first because they relay traffic from many other nodes, creating an energy hole.`],
[4,`A passive RFID tag has no battery: it harvests the reader’s field to power its chip and replies by modulating that field.`,0,`True. A passive RFID tag has no battery; it harvests energy from the reader field and responds by backscatter.`],
];
BANK.forEach(r => Q.push({ id: Q.length, w: r[0], s: 5, t: 'mc', q: r[1], o: r[2], a: r[3], e: r[4] }));
BANK_TF.forEach(r => Q.push({ id: Q.length, w: r[0], s: 5, t: 'tf', q: r[1], o: ["صح ✔ True", "غلط ✘ False"], a: r[2], e: r[3] }));
Q.forEach(x => { if (x.s === undefined) x.s = x.w; });
WEEKS[5] = { title: "البنك المحلول — Weeks 1–4", summary: [
  "60 سؤال اختيار من متعدد + 20 سؤال صح أو غلط من البنك المحلول، والأسئلة والإجابات كما هي في الملف.",
  "الأسئلة مرتبة بالترتيب: اختيار من متعدد من الأسابيع 1 لـ 4، بعدين صح أو غلط من نفس الأسابيع.",
  "كل إجابة فيها شرح مختصر، بعد ما تجاوب مباشرة.",
  "تقدر تخلط الأسئلة، وتعيد الأسئلة اللي غلطت فيها، ويتحسب السكور النهائي بعد كل مراجعة."
] };

const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let queue = [], pos = 0, roundNo = 1, answered = false;
let totalQ = 0, firstCorrect = 0, liveRight = 0, liveWrong = 0;
let pending = [], curWeek = 1, shuffleOn = false;

function show(id){ ["home","summary","quiz","results"].forEach(s => $(s).classList.toggle('hide', s !== id)); }
function shuffleArr(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function renderHome(){
  const grid = $("weekGrid"); grid.innerHTML = "";
  [1,2,3,4,5].forEach(w => {
    const n = Q.filter(x => x.s === w).length;
    const b = document.createElement("button");
    b.className = "wcard";
    b.innerHTML = `<div class="wt"><h3>${WEEKS[w].title}</h3><span class="cnt">${n} سؤال</span></div>
      <ul>${WEEKS[w].summary.slice(0,2).map(s=>`<li>${s}</li>`).join("")}</ul>
      <div class="go">اقرأ الملخص وابدأ ←</div>`;
    b.onclick = () => openSummary(w);
    grid.appendChild(b);
  });
}

function home(){ renderHome(); show("home"); }

function openSummary(w){
  curWeek = w;
  $("sumTitle").textContent = WEEKS[w].title;
  $("sumCount").textContent = Q.filter(x => x.s === w).length + " سؤال";
  $("sumList").innerHTML = WEEKS[w].summary.map(s => `<li>${s}</li>`).join("");
  show("summary");
}

function startQuiz(){
  let idxs = Q.map((_,i)=>i).filter(i => Q[i].s === curWeek);
  if (shuffleOn) idxs = shuffleArr(idxs);
  totalQ = idxs.length;
  pending = idxs.slice();
  firstCorrect = 0; liveRight = 0; liveWrong = 0; roundNo = 1;
  startRound(idxs);
}

function startRound(list){ queue = list; pos = 0; show("quiz"); showQ(); }

function showQ(){
  const qi = queue[pos], q = Q[qi];
  answered = false;
  const card = $("qcard");
  card.classList.remove("out","shake"); void card.offsetWidth; card.style.animation="none"; void card.offsetWidth; card.style.animation="";
  $("wk").textContent = "الأسبوع " + q.w;
  $("type").textContent = WEEKS[curWeek].title.split("—")[0].trim() + (roundNo>1 ? " · مراجعة" : "");
  $("counter").textContent = `سؤال ${pos+1} من ${queue.length}`;
  $("prog").style.width = (pos/queue.length*100) + "%";
  $("liveScore").textContent = liveRight;
  $("liveWrong").textContent = liveWrong;
  $("qtext").textContent = q.q;
  $("qtext").style.direction = "ltr";
  $("feed").className = "feed hide";
  $("nextBtn").classList.add("hide");
  const box = $("opts"); box.innerHTML = "";
  q.o.forEach((txt,i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="k">${q.t==='tf' ? ['T','F'][i] : LETTERS[i]}</span><span>${txt}</span>`;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function choose(i){
  if (answered) return;
  answered = true;
  const qi = queue[pos], q = Q[qi];
  const ok = i === q.a;
  const btns = [...document.querySelectorAll(".opt")];
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("right");
  if (!ok) btns[i].classList.add("wrong");
  if (ok) { liveRight++; pending = pending.filter(x => x !== qi); if (roundNo===1) firstCorrect++; }
  else { liveWrong++; $("qcard").classList.add("shake"); }
  const feed = $("feed");
  feed.className = "feed " + (ok ? "ok" : "bad");
  const lab = q.t==='tf' ? (q.a===0 ? "صح — True" : "غلط — False") : LETTERS[q.a] + ") " + q.o[q.a];
  feed.innerHTML = `<h3>${ok ? "إجابة صحيحة 🎉" : "إجابة غلط 😅 الصح: " + lab}</h3><p>${q.e}</p>`;
  $("liveScore").textContent = liveRight;
  $("liveWrong").textContent = liveWrong;
  $("nextBtn").textContent = pos === queue.length-1 ? "شوف النتيجة 🏁" : "السؤال الجاي ←";
  $("nextBtn").classList.remove("hide");
  $("prog").style.width = ((pos+1)/queue.length*100) + "%";
}

function next(){
  if (!answered) return;
  if (pos < queue.length-1) { pos++; $("qcard").classList.add("out"); setTimeout(showQ, 280); }
  else endRound();
}

function endRound(){
  const solved = totalQ - pending.length;
  const pct = Math.round(solved/totalQ*100);
  show("results");
  $("firstScore").textContent = `${firstCorrect} / ${totalQ}`;
  $("finalScore").textContent = `${solved} / ${totalQ}`;
  $("pctNum").textContent = pct + "%";
  $("pctSub").textContent = pending.length ? `باقي ${pending.length}` : "كله صح! ✨";
  let msg, sub;
  if (pending.length === 0) { msg = "عاش يا بطل! 🔥"; sub = "حليت كل أسئلة الأسبوع صح. انت جاهز."; }
  else if (pct >= 90) { msg = "ممتاز جداً 👏"; sub = `فاضل ${pending.length} سؤال بس، راجعهم وخلصهم.`; }
  else if (pct >= 70) { msg = "شغل محترم 💪"; sub = `راجع الـ ${pending.length} اللي غلطت فيهم وهترتفع النتيجة.`; }
  else if (pct >= 50) { msg = "كويس، ومحتاج شوية مراجعة"; sub = `راجع الـ ${pending.length} سؤال اللي غلطت فيهم.`; }
  else { msg = "محتاج مراجعة، بس ما تقلقش 🙂"; sub = "راجع الأسئلة اللي غلطت فيها وحاول تاني."; }
  $("msg").textContent = msg;
  $("sub").textContent = sub;
  const rb = $("retryBtn");
  rb.style.display = pending.length ? "" : "none";
  rb.textContent = `راجع الأسئلة اللي غلطت فيها (${pending.length})`;
  const fg = $("ringFg"), C = 490;
  fg.style.strokeDashoffset = C;
  requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = C - C*pct/100; }));
  if (pct >= 60) confettiBurst();
}

function retry(){ roundNo++; startRound(shuffleOn ? shuffleArr(pending) : pending.slice()); }

function confettiBurst(){
  const colors = ["#818cf8","#38bdf8","#22c55e","#f59e0b","#ef4444","#e879f9"];
  for (let i=0;i<70;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2.5 + Math.random()*2.5) + "s";
    c.style.animationDelay = (Math.random()*0.8) + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

$("shuffle").addEventListener("change", e => { shuffleOn = e.target.checked; });
$("startBtn").addEventListener("click", startQuiz);
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hide")) return;
  if (["1","2","3","4"].includes(e.key) && !answered) {
    const n = Number(e.key) - 1;
    if (n < Q[queue[pos]].o.length) choose(n);
  }
  if (e.key === "Enter" && answered) next();
});

home();

</script>
</body>
</html>
