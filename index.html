<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنك أسئلة CS412 — إنترنت الأشياء</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e1b4b; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --txt:#f1f5f9; --mut:#94a3b8; --acc:#818cf8; --acc2:#38bdf8;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Tahoma,"Segoe UI",Arial,sans-serif; color:var(--txt);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh; overflow-x:hidden; display:flex; align-items:center; justify-content:center; padding:20px;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;animation:float 16s ease-in-out infinite}
.b1{width:340px;height:340px;background:#6366f1;top:-80px;right:-60px}
.b2{width:280px;height:280px;background:#0ea5e9;bottom:-70px;left:-50px;animation-delay:-6s}
.b3{width:200px;height:200px;background:#a855f7;top:40%;left:40%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-25px) scale(1.08)}}

.app{position:relative;z-index:1;width:100%;max-width:640px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hide{display:none !important}

/* header */
.head{text-align:center;padding:26px 24px 6px;animation:fadeDown .7s ease both}
.head h1{margin:0;font-size:22px;letter-spacing:.2px}
.head p{margin:6px 0 0;color:var(--mut);font-size:14px}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* start */
#start{padding:24px;text-align:center;animation:fadeUp .8s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.icon-big{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.modes{display:grid;gap:12px;margin:22px 0 10px}
.mode{
  padding:16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);cursor:pointer;font-size:16px;text-align:right;transition:.25s;position:relative;overflow:hidden
}
.mode small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.mode:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 25px rgba(129,140,248,.25)}
.mode:active{transform:scale(.98)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 10px 25px rgba(56,189,248,.3);
  transition:transform .2s, box-shadow .2s, opacity .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(56,189,248,.4)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* quiz */
#quiz{padding:22px 24px 26px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:10px}
.pill{padding:4px 12px;border-radius:999px;background:rgba(129,140,248,.18);color:#c7d2fe;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scorebox{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:14px}
.scorebox b{color:var(--txt)}
.qcard{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.qcard.out{animation:slideOut .3s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.qcard.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:rgba(56,189,248,.15);color:#7dd3fc;margin-left:6px}
.qtext{font-size:17px;line-height:1.75;margin:12px 0 18px;direction:ltr;text-align:left}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;direction:ltr;
  padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);font-size:15px;cursor:pointer;transition:.2s;animation:popIn .4s ease both
}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(-4px);background:rgba(129,140,248,.1)}
.opt .k{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:700;font-size:13px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(34,197,94,.16);animation:pulseOk .6s}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.16)}
.opt.right .k{background:var(--ok)} .opt.wrong .k{background:var(--bad)}
@keyframes pulseOk{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

.feed{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.7;animation:fadeUp .4s ease both}
.feed.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4)}
.feed.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
.feed h3{margin:0 0 6px;font-size:15px}
.feed p{margin:0;color:#e2e8f0;direction:ltr;text-align:left}
.next-row{display:flex;justify-content:flex-start;margin-top:16px}

/* results */
#results{padding:30px 24px;text-align:center;animation:fadeUp .7s ease both}
.ring{position:relative;width:180px;height:180px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
.ring .num small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.msg{font-size:18px;margin:6px 0 4px;animation:fadeUp .8s .2s both}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.stat{padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);animation:popIn .5s both}
.stat:nth-child(2){animation-delay:.12s}
.stat b{display:block;font-size:22px;margin-top:4px}
.actions{display:grid;gap:10px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

.footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.4);z-index:1}
kbd{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="app">
  <div class="glass">
    <div class="head">
      <h1>بنك أسئلة CS412 · إنترنت الأشياء</h1>
      <p>الأسابيع 1 – 4 · اختيار من متعدد + صح أو غلط</p>
    </div>

    <!-- START -->
    <div id="start">
      <div class="icon-big">🧠</div>
      <p style="color:var(--mut);margin:12px 0 0">اختار نوع الكويز وابدأ. أي سؤال تغلط فيه هتقدر تراجعه في الآخر وتحاول تاني.</p>
      <div class="modes">
        <button class="mode" onclick="pick('all')">الكل<small>80 سؤال</small></button>
        <button class="mode" onclick="pick('mc')">اختيار من متعدد<small>60 سؤال</small></button>
        <button class="mode" onclick="pick('tf')">صح أو غلط<small>20 سؤال</small></button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="hide">
      <div class="topbar"><span id="counter"></span><span class="pill" id="type"></span></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="scorebox"><span>صح حتى الآن: <b id="liveScore">0</b></span><span>غلط: <b id="liveWrong">0</b></span></div>
      <div id="qcard" class="qcard">
        <span class="tag" id="wk"></span>
        <div class="qtext" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div id="feed" class="feed hide"></div>
        <div class="next-row"><button class="btn hide" id="nextBtn" onclick="next()">السؤال الجاي ←</button></div>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="results" class="hide">
      <div class="ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
          <circle class="bg" cx="90" cy="90" r="78" fill="none" stroke-width="14"/>
          <circle class="fg" id="ringFg" cx="90" cy="90" r="78" fill="none" stroke-width="14" stroke-dasharray="490" stroke-dashoffset="490"/>
        </svg>
        <div class="num"><div><span id="pctNum">0%</span><small id="pctSub"></small></div></div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="sub" id="sub"></div>
      <div class="stats">
        <div class="stat">من أول محاولة<b id="firstScore">0</b></div>
        <div class="stat">بعد المراجعة<b id="finalScore">0</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="retryBtn" onclick="retry()">راجع الأسئلة اللي غلطت فيها</button>
        <button class="btn ghost" onclick="home()">ابدأ من جديد</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">اختصارات: <kbd>1</kbd>–<kbd>4</kbd> للاختيار · <kbd>Enter</kbd> للسؤال الجاي</div>

<script>
const LBL_TF = ["صح ✔ True", "غلط ✘ False"];
const LETTERS = ["A","B","C","D"];

/* ===== QUESTIONS (80) ===== */
const Q = [
{w:1,t:'mc',q:"Which standards document defines IoT as “a global infrastructure for the information society, enabling advanced services by interconnecting (physical and virtual) things”?",o:["3GPP Release 13","IEEE 802.15.4","ITU-T Recommendation Y.2060","MQTT 5 (OASIS)"],a:2,e:"ITU-T Y.2060 gives the standards-body definition of IoT."},
{w:1,t:'mc',q:"In the cellular M2M period (1995–2010), which technology enabled vending machines, alarms and trucks to be connected?",o:["GSM SMS and GPRS modules","leased lines and private radio","IPv6 and 6LoWPAN","NB-IoT and LoRaWAN"],a:0,e:"The cellular M2M period used GSM SMS and GPRS modules to connect these devices."},
{w:1,t:'mc',q:"In the early 1980s, which device at Carnegie Mellon reported its stock over the ARPANET?",o:["a smart electricity meter","an RFID-tagged pallet","a lift emergency phone","a Coca-Cola vending machine"],a:3,e:"The Carnegie Mellon example was a Coca-Cola vending machine reporting its stock over ARPANET."},
{w:1,t:'mc',q:"In which 3GPP release were LTE-M and NB-IoT added?",o:["Release 8 (2008)","Release 13 (2016)","Release 15 (2018)","Release 17 (2022)"],a:1,e:"The notes state that 3GPP added LTE-M and NB-IoT in Release 13 (2016)."},
{w:1,t:'mc',q:"A classic M2M solution has four parts. Which of them is described as optional?",o:["the M2M area network","the M2M device","the communication network","the M2M application"],a:0,e:"The classic four-part M2M solution includes an optional M2M area network."},
{w:1,t:'mc',q:"Each silo application costs $500k, while a shared platform costs $700k plus $100k per application. How much does the shared platform save for five applications?",o:["$0.5M","$0.8M","$1.0M","$1.3M"],a:3,e:"Five silos cost 5×$500k = $2.5M; the shared platform costs $700k + 5×$100k = $1.2M, saving $1.3M."},
{w:1,t:'mc',q:"According to the textbook, the IoT vision is a move from closed, vertical, device-centric point solutions towards systems that are:",o:["closed, horizontal and device-centric","open, vertical and application-centric","open, horizontal and information-centric","proprietary, horizontal and network-centric"],a:2,e:"The IoT vision is open, horizontal and information-centric rather than closed and vertical."},
{w:1,t:'mc',q:"A sensor observes whether a parking bay is occupied. In IoT terms, the parking bay itself is:",o:["the Device","the Physical Entity, the “thing” of interest","the gateway","the broker"],a:1,e:"The parking bay is the Physical Entity being observed; the sensor is the Device."},
{w:1,t:'mc',q:"Which of the following is a business driver of the move from M2M to IoT?",o:["IPv6’s 2128 addresses","urbanisation","eCall regulation","products sold as services (“power by the hour”)"],a:3,e:"Selling products as services, such as power by the hour, is listed as a business driver."},
{w:1,t:'mc',q:"Around 2010, visions predicted 50 billion devices by 2020. What did analyst counts for 2020 show (excluding phones and PCs)?",o:["about 11–12 billion","about 50 billion","about 1–2 billion","about 100 billion"],a:0,e:"The notes report approximately 11–12 billion connected devices in 2020, excluding phones and PCs."},
{w:1,t:'mc',q:"600 000 meters each report every 15 minutes, and all of them send within the first 30 s of each quarter-hour. What is the peak message rate?",o:["about 667 messages/s","20 000 messages/s","10 000 messages/s","40 000 messages/s"],a:1,e:"Peak rate = 600,000 messages ÷ 30 seconds = 20,000 messages/s."},
{w:1,t:'mc',q:"A 40-byte payload is sent over MQTT/TCP/IPv4 with a 2-byte fixed header and a 24-byte topic field. What are the total size and the efficiency?",o:["66 B and 60.6 %","82 B and 48.8 %","106 B and 37.7 %","126 B and 31.7 %"],a:2,e:"Total = 20+20+2+24+40 = 106 bytes; efficiency = 40/106 ≈ 37.7%."},
{w:1,t:'mc',q:"The water meter of the notes uses 0.0556 mAh per report and 0.24 mAh per day asleep. What is its daily consumption if it reports every 30 minutes?",o:["0.24 mAh/day","1.57 mAh/day","5.57 mAh/day","2.91 mAh/day"],a:3,e:"Every 30 minutes gives 48 reports: 48×0.0556 + 0.24 ≈ 2.91 mAh/day."},
{w:1,t:'mc',q:"According to the M2M versus IoT comparison table, what is the main value of M2M?",o:["new services and knowledge from combined data","operational efficiency","data marketplaces","integration with ERP and CRM"],a:1,e:"The comparison table identifies operational efficiency as M2M’s main value."},
{w:1,t:'mc',q:"Which subscription receives messages published to both cs412/meter/42/kwh and cs412/pump/7/status?",o:["cs412/#","cs412/meter/+/kwh","cs412/+/kwh","cs412/meter/#"],a:0,e:"The # wildcard matches all topics below cs412, including both meter and pump topics."},
{w:2,t:'mc',q:"The idea of the value chain, which the textbook applies to M2M and IoT, was first introduced inside one firm by:",o:["James Moore (1993)","Michael Porter (1985)","Stan Shih (1992)","Gereffi, Humphrey and Sturgeon (2005)"],a:1,e:"Michael Porter introduced the value-chain idea inside one firm in 1985."},
{w:2,t:'mc',q:"In the five generic value-chain stages, the stage where IoT products are combined and made saleable as dashboards, APIs or information products is:",o:["inputs","production / processing","distribution / marketing","packaging"],a:3,e:"Packaging combines and prepares information products such as dashboards and APIs for sale."},
{w:2,t:'mc',q:"App developers who must work on one dominant platform’s terms are an example of which type of global value chain governance?",o:["Captive","Modular","Relational","Market"],a:0,e:"Captive governance describes small suppliers or developers dependent on a dominant buyer/platform’s terms."},
{w:2,t:'mc',q:"In the 1970s, IBM or DEC made the chips, the computer, the operating system and the applications. This is an example of which industrial structure?",o:["Horizontal","Modular","Vertical","Ecosystem"],a:2,e:"This is vertical integration: one firm performed multiple successive industry layers."},
{w:2,t:'mc',q:"According to the textbook, M2M value chains are:",o:["short, closed and vertically integrated","long, open and horizontal","many-to-many and coordinated by a platform","built mainly on open data and corporate databases"],a:0,e:"The notes describe M2M value chains as short, closed and vertically integrated."},
{w:2,t:'mc',q:"In the 2005 fleet-tracking example the customer pays $480 up front and $20/month, of which connectivity takes $10. If the contract lasted 24 months instead of 36, what would connectivity’s share of the total be?",o:["20 %","25 %","30 %","35 %"],a:1,e:"Connectivity revenue = 24×$10 = $240; total spend = $480 + $480 = $960; share = 25%."},
{w:2,t:'mc',q:"Why did mobile operators find the M2M market of the 2000s disappointing?",o:["M2M devices could not use mobile networks","Module makers refused to sell them SIM cards","Regulators banned M2M connections on phone networks","An M2M SIM earned a few dollars a month against tens for a phone"],a:3,e:"An M2M SIM earned only a few dollars monthly, compared with tens of dollars for a phone."},
{w:2,t:'mc',q:"Network load, coarse location and billing data taken from a mobile operator’s systems belong to which input type of the IoT value chain?",o:["Open data","Corporate databases","OSS/BSS data","Devices and sensors"],a:2,e:"OSS/BSS data includes operator network load, coarse location and billing information."},
{w:2,t:'mc',q:"“A traffic reading is valuable for minutes, a meter history for years.” Which property of information as a commodity does this describe?",o:["Perishable","Non-rival","Combinable","Near-zero marginal cost"],a:0,e:"Perishable information loses value over time; traffic readings expire quickly while meter history lasts longer."},
{w:2,t:'mc',q:"In today’s fleet-tracking example the application and analytics provider receives $13.50 of the $20 monthly fee. How much does it earn over the 36-month contract?",o:["$180","$324","$486","$540"],a:2,e:"36 × $13.50 = $486 over the contract."},
{w:2,t:'mc',q:"The fleet provider sells its road-speed product to the city ($30k/year), a navigation app ($50k/year) and an insurer ($20k/year). Suppose a fourth buyer joins at $40k/year and packaging still costs $5k per buyer. What is the new extra margin per year?",o:["$100k","$120k","$135k","$140k"],a:1,e:"Four buyers pay $140k in total; packaging costs 4×$5k = $20k, leaving a $120k margin."},
{w:2,t:'mc',q:"The “smile curve” of value added was first described by:",o:["Michael Porter, for supermarkets","James Moore, for business ecosystems","Andy Grove, for chip makers","Stan Shih of Acer, for PCs"],a:3,e:"Stan Shih of Acer described the smile curve for PCs in 1992."},
{w:2,t:'mc',q:"In the information-driven global value chain (I-GVC), a meteorological office that produces data in digital form for others to use plays the role of:",o:["intermediary","reseller","data factory","service provider / data wholesaler"],a:2,e:"A data factory produces digital data for others to use; the notes give meteorological offices as an example."},
{w:2,t:'mc',q:"Platform A has 2 000 connected partners and platform B has 500. Under the n² value rule, how many times more valuable is A than B?",o:["16","4","8","1 500"],a:0,e:"Value is proportional to n²: (2,000/500)² = 16."},
{w:2,t:'mc',q:"Four IoT platforms hold 30 %, 30 %, 20 % and 20 % of a market. What is the HHI?",o:["1 000","2 600","1 800","10 000"],a:1,e:"HHI = 30² + 30² + 20² + 20² = 2,600."},
{w:3,t:'mc',q:"“A meter lives 15 years, far longer than the apps that read it, so parts must be replaceable behind fixed interfaces.” Which pressure on IoT architecture does this sentence describe?",o:["Scale","Longevity","Heterogeneity","Self-organisation"],a:1,e:"A 15-year meter outliving its applications illustrates the longevity pressure."},
{w:3,t:'mc',q:"What do the notes mean by “IoT is M2M made horizontal”?",o:["Every new application builds its own device management, storage and security","All devices in a deployment must use the same radio technology","The cloud replaces gateways so that every device talks directly to the application","Capabilities every application needs are pulled out of the silos into shared layers, so a new application costs only its own business logic"],a:3,e:"Horizontal IoT moves shared capabilities into common layers, so each new app mainly adds its own logic."},
{w:3,t:'mc',q:"In the ISO/IEC/IEEE 42010 definition of an architecture, what do the principles of design and evolution refer to?",o:["The rules that decide how new boxes are added to the system","The boxes drawn in the architecture diagram","The arrows that connect the components","The concerns of the stakeholders, such as cost and privacy"],a:0,e:"Design and evolution principles are the rules guiding how the architecture is designed and changed over time."},
{w:3,t:'mc',q:"Why do the notes treat security as a perspective rather than as a separate view?",o:["Because security only concerns where components are deployed","Because security can be added after the first devices ship","Because it is a quality that touches the functional, information and deployment views alike","Because security has no stakeholders of its own"],a:2,e:"Security is cross-cutting: it affects the functional, information and deployment views."},
{w:3,t:'mc',q:"Which viewpoint answers the question “where does each component run, and how is it managed?”",o:["Functional","Deployment and operational","Information","Business"],a:1,e:"The deployment and operational viewpoint specifies where components run and how they are managed."},
{w:3,t:'mc',q:"Which level of abstraction has the scope of one system and commits completely to specific technology?",o:["Concrete architecture","Reference model","Reference architecture","Domain vocabulary"],a:0,e:"A concrete architecture describes one system and commits to specific technologies."},
{w:3,t:'mc',q:"Which design principle do the notes link to the needed capability heterogeneity of devices?",o:["Duty cycling and pushing work to mains-powered tiers","Location as first-class metadata","Zero-touch provisioning and self-forming mesh networks","Abstraction: exposing devices as uniform resources and services"],a:3,e:"Abstraction presents heterogeneous devices through uniform resources and services."},
{w:3,t:'mc',q:"According to the notes, why can a device deployed without a secure boot chain, a unique identity and an authenticated update mechanism not simply have them added later?",o:["Because adding security would drain the device’s battery too quickly","Because regulators forbid firmware updates after deployment","Because the device has no key to verify the update that would install them","Because MQTT cannot carry firmware updates"],a:2,e:"Without an existing trusted key, the device cannot authenticate the later update that would add secure boot and identity features."},
{w:3,t:'mc',q:"In the smart-metering example of the IoT architecture outline, the data concentrator on the substation belongs to which layer?",o:["Gateway","Device","Network","Service"],a:0,e:"The substation data concentrator performs gateway functions in the architecture outline."},
{w:3,t:'mc',q:"Which two functions cut across every layer of the IoT architecture outline?",o:["Business and application","Management and security","Gateway and network","Analytics and billing"],a:1,e:"Management and security are cross-layer functions in the IoT architecture outline."},
{w:3,t:'mc',q:"When ETSI’s M2M work passed to oneM2M, what was the Service Capability Layer (SCL) renamed?",o:["Service Capability Gateway","Thing Description","Common Services Entity (CSE)","Virtual Entity"],a:2,e:"oneM2M’s Common Services Entity (CSE) superseded the ETSI Service Capability Layer (SCL)."},
{w:3,t:'mc',q:"10,000 sensors each send one 30-byte reading every 10 minutes (144 readings per day) directly over MQTT/TCP/IPv4, with 72 bytes of headers per message. About how many bytes reach the cloud per day for the whole fleet?",o:["43.2 MB","103.7 MB","14.7 MB","146.9 MB"],a:3,e:"Each sensor sends 30+72 = 102 bytes; 10,000 × 144 × 102 = 146,880,000 bytes ≈ 146.9 MB/day."},
{w:3,t:'mc',q:"In the cold-store alarm example, suppose each radio hop between node and gateway takes 30 ms instead of 20 ms, with all other stages unchanged. What is the latency of the edge loop?",o:["70 ms","90 ms","80 ms","350 ms"],a:1,e:"The edge loop has two radio hops. Replacing each 20 ms hop with 30 ms adds 20 ms: 70 + 20 = 90 ms."},
{w:3,t:'mc',q:"A gateway uses two independent WAN links in parallel, each with availability 0.98. What is the availability of the combined WAN?",o:["0.9996","0.9604","0.9800","0.9900"],a:0,e:"Two independent links in parallel fail together with probability 0.02²; availability = 1 − 0.0004 = 0.9996."},
{w:3,t:'mc',q:"Which standards body published MQTT 3.1.1 (2014) and MQTT 5 (2019)?",o:["IETF","3GPP","OASIS","W3C"],a:2,e:"OASIS published MQTT 3.1.1 and MQTT 5, as stated in the standards table."},
{w:4,t:'mc',q:"Which of the following is a self-generating (sometimes called “active”) sensor?",o:["A thermistor","A thermocouple","A strain gauge","An NTC 10 kΩ resistor"],a:1,e:"A thermocouple is self-generating: it produces a voltage from a temperature difference."},
{w:4,t:'mc',q:"A 10 mV/°C temperature sensor is read by a 10-bit ADC with a reference of 2.048 V. What is the temperature resolution per count?",o:["0.02 °C","0.08 °C","0.32 °C","0.2 °C"],a:3,e:"A 10-bit ADC has 2.048 V ÷ 1024 = 2 mV per count; at 10 mV/°C this is 0.2 °C per count."},
{w:4,t:'mc',q:"Using the formula SNR ≈ 6.02N + 1.76 dB, what is the ideal signal-to-noise ratio of a 10-bit converter?",o:["About 62 dB","About 74 dB","About 50 dB","About 98 dB"],a:0,e:"SNR = 6.02×10 + 1.76 = 61.96 dB, approximately 62 dB."},
{w:4,t:'mc',q:"A signal contains components up to 400 Hz. According to the Nyquist criterion, the sampling rate must be:",o:["above 200 Hz","above 400 Hz","above 800 Hz","above 4 kHz"],a:2,e:"Nyquist requires sampling above twice the maximum frequency: greater than 800 Hz."},
{w:4,t:'mc',q:"A 3-axis accelerometer samples at 1.6 kHz with 16-bit samples. What is its raw data rate?",o:["25.6 kbit/s","153.6 kbit/s","76.8 kbit/s","9.6 kbit/s"],a:2,e:"Raw rate = 3 axes × 1,600 samples/s × 16 bits = 76,800 bit/s = 76.8 kbit/s."},
{w:4,t:'mc',q:"Ten readings of a 25.0 °C reference cluster tightly around 25.8 °C. Which statement is correct?",o:["The sensor is precise but inaccurate, and calibration will fix it.","The sensor is accurate but imprecise, and averaging will fix it.","The sensor is precise but inaccurate, and a higher-resolution ADC will fix it.","The sensor is accurate and precise, so nothing needs fixing."],a:0,e:"The tight cluster shows precision, but the 0.8 °C bias means poor accuracy; calibration corrects bias."},
{w:4,t:'mc',q:"A node reads 300 counts at 0 °C and 3,300 counts at 100 °C. Using two-point calibration, what temperature corresponds to 1,500 counts?",o:["45.5 °C","50.0 °C","36.4 °C","40.0 °C"],a:3,e:"The calibrated span is 3,000 counts for 100 °C; (1,500 − 300)/3,000 × 100 = 40 °C."},
{w:4,t:'mc',q:"Why must battery-powered actuators such as solenoid valves be latching?",o:["Latching actuators can be driven directly from an I²C bus.","They need only a short pulse (about 20 ms) per change of state instead of continuous current.","Latching removes the need for a driver circuit.","Latching actuators draw less current than a sensor while held open."],a:1,e:"A latching valve needs only a short pulse to change state, avoiding continuous holding current."},
{w:4,t:'mc',q:"Which subsystem of a sensor node is normally the largest energy consumer?",o:["The communication subsystem (radio)","The sensing subsystem","The processing subsystem (MCU)","The voltage regulator in the power unit"],a:0,e:"The radio/communication subsystem is normally the largest energy consumer."},
{w:4,t:'mc',q:"A node draws 20 mA for 100 ms every 30 s and 2 µA for the rest of the period. What is its approximate average current?",o:["20 µA","2 µA","69 µA","667 µA"],a:2,e:"Average ≈ [20×0.1 + 0.002×29.9] / 30 mA ≈ 0.0687 mA ≈ 69 µA."},
{w:4,t:'mc',q:"A node has an ideal battery life of 5 years. Applying the notes’ starting rule for derating datasheet capacity, what life should you expect?",o:["4.5 years","3.5 years","2.5 years","5 years"],a:1,e:"The notes derate ideal battery life by 30%; 5 × 0.70 = 3.5 years."},
{w:4,t:'mc',q:"An indoor PV panel of 30 cm² harvests 20 µW/cm² for 12 hours a day. What is the harvested power averaged over 24 hours?",o:["600 µW","150 µW","250 µW","300 µW"],a:3,e:"Average harvested power = 30 × 20 × 12 / 24 = 300 µW."},
{w:4,t:'mc',q:"In which WSN topology does a failed router cut off its whole subtree?",o:["Star","Mesh","Tree","Cluster-tree with rotating heads"],a:2,e:"In a tree topology, a router failure disconnects every node in its subtree."},
{w:4,t:'mc',q:"Using the first-order radio model (E_elec = 50 nJ/bit, ε_amp = 100 pJ/bit/m²), what energy is needed to send a 4,000-bit packet directly over 100 m?",o:["4.2 mJ","2.1 mJ","4.0 mJ","0.2 mJ"],a:0,e:"Transmission energy = 4,000×50 nJ + 4,000×100 pJ×100² = 0.2 + 4.0 = 4.2 mJ."},
{w:4,t:'mc',q:"Which description of Near-Field Communication (NFC) matches the notes?",o:["A UHF technology with a range of several metres","A 13.56 MHz HF technology with a range of a few centimetres","A 2.4 GHz technology used mainly for mesh networks","An LF technology that reads hundreds of tags per second"],a:1,e:"NFC is an HF technology at 13.56 MHz with a range of only a few centimetres."},

/* ===== TRUE / FALSE (20) ===== */
{w:1,t:'tf',q:"Kevin Ashton coined the term Internet of Things in 1999 while working on RFID at Procter & Gamble and the MIT Auto-ID Center.",a:0,e:"True. The notes state Kevin Ashton coined the term in 1999 while working on RFID at P&G and the MIT Auto-ID Center."},
{w:1,t:'tf',q:"In the city worked example, a fourth application costs the same marginal amount, $500k, on a shared platform as it does as a silo.",a:1,e:"False. A fourth application costs $100k at the margin on the shared platform, not $500k."},
{w:1,t:'tf',q:"If the water meter reports hourly, its computed battery life is about 33 years, but the cell’s shelf life of about 10 years limits it first.",a:0,e:"True. Hourly reporting gives about 33 years mathematically, but the practical cell shelf life is about 10 years."},
{w:1,t:'tf',q:"IoT replaces M2M, so device-to-application links such as a meter reporting to its head-end become obsolete.",a:1,e:"False. IoT contains M2M and adds shared interfaces and data reuse; it does not make device-to-application links obsolete."},
{w:1,t:'tf',q:"On the public broker test.mosquitto.org, anyone can read what you publish and publish to your topic.",a:0,e:"True. The public test broker allows anyone to read published data and publish to the topic."},
{w:2,t:'tf',q:"In the 2005 fleet-tracking example, the customer spends a total of $1 200 over the 36-month contract.",a:0,e:"True. $480 upfront plus 36 × $20 monthly equals $1,200."},
{w:2,t:'tf',q:"Google Cloud IoT Core was shut down in August 2023, forcing its customers to migrate to other platforms.",a:0,e:"True. The notes state Google Cloud IoT Core shut down in August 2023 and customers had to migrate."},
{w:2,t:'tf',q:"Under the 2023 US Merger Guidelines, a market is treated as highly concentrated when its HHI is above 1 000.",a:1,e:"False. The notes define highly concentrated as HHI above 1,800, not 1,000."},
{w:2,t:'tf',q:"The EU Data Act gives platform owners exclusive control over the data that connected products generate.",a:1,e:"False. The EU Data Act gives users rights to access and share connected-product data; it does not give owners exclusive control."},
{w:2,t:'tf',q:"In the Lab 2 marketplace, buyers receive district totals instead of raw meter readings, so no single household is visible.",a:0,e:"True. The marketplace publishes district-level aggregates rather than exposing individual raw household readings."},
{w:3,t:'tf',q:"For a single application, a vertical M2M silo is often the cheapest design.",a:0,e:"True. For one application, a vertical silo is often the cheapest design; repeated silos become costly as applications grow."},
{w:3,t:'tf',q:"A reference architecture commits completely to specific products, protocols and deployment.",a:1,e:"False. A reference architecture is a reusable blueprint; a concrete architecture commits to specific products and deployment."},
{w:3,t:'tf',q:"In the ETSI M2M high-level architecture, the M2M applications sit in the network domain.",a:0,e:"True. In ETSI M2M, the network domain hosts the applications, while device/gateway elements form the other domain."},
{w:3,t:'tf',q:"In the smart-metering example, adding data concentrators cut both the number of messages and the number of bytes by the same factor of 200.",a:1,e:"False. The concentrator reduces message count 200-fold, but bytes only 2.8-fold because headers are amortised."},
{w:3,t:'tf',q:"The availability of the data can never be higher than the availability of the path it travels over.",a:1,e:"False. Store-and-forward buffering can preserve data availability even when the communication path is temporarily unavailable."},
{w:4,t:'tf',q:"A digital sensor module has its own ADC and delivers numbers over a bus such as I²C, SPI, UART or 1-Wire.",a:0,e:"True. A digital sensor module can contain its own ADC and output digital values over buses such as I²C or SPI."},
{w:4,t:'tf',q:"Using an ADC with more bits will remove a sensor’s bias.",a:1,e:"False. More ADC bits improve resolution, but they do not remove sensor bias; calibration is needed."},
{w:4,t:'tf',q:"In the notes’ example node with a 60 s period, the duty cycle is only about 0.42%, yet the active phases use about 92% of the charge.",a:0,e:"True. The notes give a 0.42% duty cycle while active phases account for about 92% of the charge."},
{w:4,t:'tf',q:"In a multi-hop WSN, the nodes farthest from the sink die first because they send the most packets.",a:1,e:"False. Nodes near the sink usually die first because they relay traffic from many other nodes, creating an energy hole."},
{w:4,t:'tf',q:"A passive RFID tag has no battery: it harvests the reader’s field to power its chip and replies by modulating that field.",a:0,e:"True. A passive RFID tag has no battery; it harvests energy from the reader field and responds by backscatter."}
];

/* ===== ENGINE ===== */
const $ = id => document.getElementById(id);
let pending = [], queue = [], pos = 0, roundNo = 1, answered = false;
let totalQ = 0, firstCorrect = 0, firstDone = false, liveRight = 0, liveWrong = 0, mode = 'all';

function show(id){ ["start","quiz","results"].forEach(s => $(s).classList.toggle('hide', s !== id)); }

function pick(m){
  mode = m;
  const idxs = Q.map((_,i)=>i).filter(i => m==='all' || Q[i].t===m);
  totalQ = idxs.length;
  pending = idxs.slice();
  firstCorrect = 0; firstDone = false; liveRight = 0; liveWrong = 0; roundNo = 1;
  startRound(pending.slice());
}

function startRound(list){
  queue = list; pos = 0;
  show('quiz');
  showQ();
}

function showQ(){
  const qi = queue[pos], q = Q[qi];
  answered = false;
  const card = $('qcard');
  card.classList.remove('out','shake'); void card.offsetWidth; card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  $('wk').textContent = 'الأسبوع ' + q.w;
  $('type').textContent = q.t==='tf' ? 'صح أو غلط' : 'اختيار من متعدد';
  $('counter').textContent = roundNo===1 ? `سؤال ${pos+1} من ${queue.length}` : `مراجعة · جولة ${roundNo} · ${pos+1} من ${queue.length}`;
  $('prog').style.width = (pos/queue.length*100) + '%';
  $('liveScore').textContent = liveRight;
  $('liveWrong').textContent = liveWrong;
  $('qtext').textContent = q.q;
  $('feed').className = 'feed hide';
  $('nextBtn').classList.add('hide');

  const opts = q.t==='tf' ? LBL_TF : q.o;
  const box = $('opts'); box.innerHTML = '';
  opts.forEach((txt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${q.t==='tf'? (i===0?'T':'F') : LETTERS[i]}</span><span>${txt}</span>`;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function choose(i){
  if(answered) return;
  answered = true;
  const qi = queue[pos], q = Q[qi];
  const ok = i === q.a;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[q.a].classList.add('right');
  if(!ok) btns[i].classList.add('wrong');

  if(ok){
    liveRight++;
    pending = pending.filter(x => x!==qi);
    if(roundNo===1) firstCorrect++;
  } else {
    liveWrong++;
    $('qcard').classList.add('shake');
  }
  if(roundNo===1 && !firstDone && pos===queue.length-1) firstDone = true;

  const correctTxt = q.t==='tf' ? (q.a===0?'صح — True':'غلط — False') : q.o[q.a];
  const feed = $('feed');
  feed.className = 'feed ' + (ok?'ok':'bad');
  feed.innerHTML = `<h3>${ok ? 'إجابة صحيحة 🎉' : 'إجابة غلط 😅 الصح: '+correctTxt}</h3><p>${q.e}</p>`;
  $('liveScore').textContent = liveRight;
  $('liveWrong').textContent = liveWrong;
  $('nextBtn').textContent = pos===queue.length-1 ? 'شوف النتيجة 🏁' : 'السؤال الجاي ←';
  $('nextBtn').classList.remove('hide');
  $('prog').style.width = ((pos+1)/queue.length*100) + '%';
}

function next(){
  if(!answered) return;
  pos++;
  if(pos < queue.length){
    const card = $('qcard');
    card.classList.add('out');
    setTimeout(showQ, 280);
  } else {
    endRound();
  }
}

function endRound(){
  const solved = totalQ - pending.length;
  const pct = Math.round(solved/totalQ*100);
  show('results');
  $('firstScore').textContent = `${firstCorrect} / ${totalQ}`;
  $('finalScore').textContent = `${solved} / ${totalQ}`;
  $('pctNum').textContent = pct + '%';
  $('pctSub').textContent = pending.length ? `باقي ${pending.length}` : 'كله صح! ✨';

  let msg, sub;
  if(pending.length===0){ msg='عاش يا بطل! 🔥'; sub='حليت كل الأسئلة صح. انت جاهز.'; }
  else if(pct>=90){ msg='ممتاز جداً 👏'; sub=`فاضل ${pending.length} سؤال بس، راجعهم وخلصهم.`; }
  else if(pct>=70){ msg='شغل محترم 💪'; sub=`راجع الـ ${pending.length} اللي غلطت فيهم وهترتفع النتيجة.`; }
  else if(pct>=50){ msg='كويس، ومحتاج شوية مراجعة'; sub=`راجع الـ ${pending.length} سؤال اللي غلطت فيهم.`; }
  else { msg='محتاج مراجعة، بس ما تقلقش 🙂'; sub=`راجع الأسئلة اللي غلطت فيها وحاول تاني.`; }
  $('msg').textContent = msg;
  $('sub').textContent = sub;

  const rb = $('retryBtn');
  rb.style.display = pending.length ? '' : 'none';
  rb.textContent = `راجع الأسئلة اللي غلطت فيها (${pending.length})`;

  // ring animation
  const fg = $('ringFg');
  const C = 490;
  fg.style.strokeDashoffset = C;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ fg.style.strokeDashoffset = C - C*pct/100; }));

  if(pct>=60) confettiBurst();
}

function retry(){
  roundNo++;
  liveRight = liveRight; // keep running totals
  startRound(pending.slice());
}

function home(){
  document.querySelectorAll('.confetti').forEach(n=>n.remove());
  show('start');
}

function confettiBurst(){
  const colors = ['#818cf8','#38bdf8','#22c55e','#f59e0b','#ef4444','#e879f9'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*0.8) + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 6000);
  }
}

document.addEventListener('keydown', e=>{
  if(!$('quiz').classList.contains('hide')){
    if(['1','2','3','4'].includes(e.key) && !answered){
      const n = Number(e.key)-1;
      const q = Q[queue[pos]];
      const count = q.t==='tf' ? 2 : q.o.length;
      if(n < count) choose(n);
    }
    if(e.key==='Enter' && answered) next();
  }
});
</script>
